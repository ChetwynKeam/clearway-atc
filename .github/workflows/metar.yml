name: Refresh LXGB METAR
# Saves the latest Gibraltar METAR as metar.txt on the site so Live METAR can read it from the same domain.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/metar.yml']
permissions:
  contents: write
concurrency: metar
jobs:
  metar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch METAR
        run: |
          M=$(curl -sSf -m 20 "https://aviationweather.gov/api/data/metar?ids=LXGB&format=raw&hours=3" | grep -m1 -E '^(METAR |SPECI )?LXGB [0-9]{6}Z' || true)
          [ -z "$M" ] && M=$(curl -sSf -m 20 "https://metar.vatsim.net/LXGB" | grep -m1 -E '^LXGB [0-9]{6}Z' || true)
          echo "METAR: $M"
          [ -z "$M" ] && { echo "No METAR found"; exit 0; }
          printf '%s\n' "$M" > metar.txt
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metar.txt
          git diff --cached --quiet && { echo "unchanged"; exit 0; }
          git commit -qm "METAR update" && git pull -q --rebase origin main && git push -q origin HEAD:main
