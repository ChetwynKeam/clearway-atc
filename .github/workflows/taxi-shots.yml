name: Taxiway map before/after (temporary)
on:
  push:
    branches: ['claude/cleaner-taxiway-map-vb7te8']
    paths: ['.github/workflows/taxi-shots.yml', '.github/taxi-close.cjs']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium
      - name: After (this branch)
        run: |
          python3 build.py && mv dist /tmp/after
          cd /tmp/after && (python3 -m http.server 8081 >/dev/null 2>&1 &) && sleep 2 && cd -
          NODE_PATH=/tmp/pw/node_modules BASE=http://localhost:8081 OUT=out/after node tools/shots/shots.cjs
          NODE_PATH=/tmp/pw/node_modules BASE=http://localhost:8081 OUT=out/after node .github/taxi-close.cjs
      - name: Before (main)
        run: |
          cp tools/shots/*.* /tmp/ && cp .github/taxi-close.cjs /tmp/ && git checkout -q origin/main -- src build.py && cp /tmp/shots.cjs /tmp/bot.js tools/shots/
          python3 build.py && mv dist /tmp/before
          cd /tmp/before && (python3 -m http.server 8082 >/dev/null 2>&1 &) && sleep 2 && cd -
          NODE_PATH=/tmp/pw/node_modules BASE=http://localhost:8082 OUT=out/before node tools/shots/shots.cjs
          NODE_PATH=/tmp/pw/node_modules BASE=http://localhost:8082 OUT=out/before node .github/taxi-close.cjs
      - name: Publish to the shots-taxiway branch
        run: |
          cd out && git init -q -b shots-taxiway
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Taxiway map before/after from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shots-taxiway
