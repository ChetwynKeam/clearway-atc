name: Probe Madeira flight feed
# One-off for the Madeira (LPMA) build: runs the Madeira step of flights.yml on this branch and saves what it got
# to the lpma-probe branch, so the parser can be checked before it reaches main.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/lpma-probe.yml', 'tools/ana_flights.py']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and parse
        run: |
          mkdir out
          UA="Mozilla/5.0 (clearway-atc; github.com/ChetwynKeam/clearway-atc)"; B="https://www.madeiraairport.pt/en/flights_proxy?day=hoje&IATA=FNC"
          curl -sS --compressed -m 30 -A "$UA" -H "X-Requested-With: XMLHttpRequest" -o out/fnc_a.json "$B&movtype=A" || true
          curl -sS --compressed -m 30 -A "$UA" -H "X-Requested-With: XMLHttpRequest" -o out/fnc_d.json "$B&movtype=D" || true
          python3 tools/ana_flights.py out/fnc_a.json out/fnc_d.json out/lpma_flights.json > out/parse.txt 2>&1 || true
          curl -sS -m 20 "https://aviationweather.gov/api/data/metar?ids=LPMA&format=raw&hours=3" -o out/metar.txt || true
          ls -la out; cat out/parse.txt
      - name: Publish to lpma-probe branch
        run: |
          cd out && git init -q && git checkout -q -b lpma-probe
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Madeira flight feed probe" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lpma-probe
