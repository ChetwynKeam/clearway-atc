name: Probe Madeira flight feed
# One-off for the Madeira (LPMA) build: fetches the scripts behind madeiraairport.pt's live flight pages so the
# flight parser can call the same data source. Results go to the lpma-probe branch.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/lpma-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          mkdir out && cd out
          BUA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          B=https://www.madeiraairport.pt
          for f in themes/custom/ANA/js/page.flights.js themes/custom/ANA/js/app.js; do curl -sS -m 60 -A "$BUA" "$B/$f" -o "$(basename $f)" || echo "FAILED $f" >> failures.txt; done
          # try the endpoints the scripts mention
          for u in $(grep -ohE "[\"'](/[a-zA-Z0-9_/.-]*(flight|voo|arriv|depart|chegad|partid)[a-zA-Z0-9_/.?=&-]*)[\"']" *.js | tr -d "\"'" | sort -u | head -20); do
            n=$(echo "$u" | tr '/?=&' '____' | cut -c1-80); curl -sS -m 60 -A "$BUA" -H "X-Requested-With: XMLHttpRequest" "$B$u" -o "ep_$n.txt" || true
            for L in en pt; do curl -sS -m 60 -A "$BUA" -H "X-Requested-With: XMLHttpRequest" "$B/$L$u" -o "ep_${L}_$n.txt" || true; done
          done
          ls -la
      - name: Publish to lpma-probe branch
        run: |
          cd out && git init -q && git checkout -q -b lpma-probe
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Madeira flight feed probe" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lpma-probe
