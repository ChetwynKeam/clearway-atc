name: Probe London City flight sources
# One-off for the London City (EGLC) build: londoncityairport.com blocks plain HTTP clients, so try a real browser and
# record the JSON the flights page loads; also sample a second public source. Results go to the eglc-probe branch.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/eglc-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Browser probe
        run: |
          mkdir out && cd out
          npm init -y >/dev/null && npm i -s playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > p.js <<'JS'
          const { chromium } = require('playwright'); const fs = require('fs');
          (async () => {
            const b = await chromium.launch(); const c = await b.newContext({ userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36', locale: 'en-GB' });
            const p = await c.newPage(); const log = []; let n = 0;
            p.on('response', async r => { const u = r.url(), ct = r.headers()['content-type'] || ''; log.push(`${r.status()} ${ct.split(';')[0]} ${u}`);
              if (/json/.test(ct) && !/google|analytics|cookie|onetrust|consent/i.test(u)) { try { fs.writeFileSync(`json_${++n}.json`, u + '\n' + await r.text()); } catch (e) {} } });
            for (const path of ['flights/arrivals', 'flights/departures']) {
              try { await p.goto('https://www.londoncityairport.com/' + path, { waitUntil: 'networkidle', timeout: 60000 }); } catch (e) { log.push('ERR ' + e.message); }
              await p.waitForTimeout(5000); fs.writeFileSync(path.replace('/', '_') + '.html', await p.content());
            }
            fs.writeFileSync('net.txt', log.join('\n')); await b.close();
          })();
          JS
          node p.js || true
          rm -rf node_modules package*.json p.js
          curl -sSL --compressed -m 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/128.0" -o avionio_arr.html -w "avionio %{http_code}\n" "https://www.avionio.com/en/airport/lcy/arrivals" || true
          ls -la
      - name: Publish to eglc-probe branch
        run: |
          cd out
          git init -q -b eglc-probe
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "EGLC flight source probe"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" eglc-probe
