name: Probe live flight feeds
# One-off check of which free live-traffic and airport-schedule sources answer, and whether browsers may read them (CORS).
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/feed-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e; exec > >(tee probe.txt) 2>&1
          UA="clearway-atc/1.0 (github.com/ChetwynKeam/clearway-atc)"
          p(){ echo "=================== $1"; curl -sS -m 25 -A "$UA" -H "Origin: https://www.clearway-atc.co.uk" -D h.txt -o b.txt "$1"; grep -iE '^(HTTP|access-control|content-type)' h.txt; head -c 1500 b.txt; echo; }
          p "https://api.adsb.lol/v2/point/36.15/-5.35/60"
          p "https://api.airplanes.live/v2/point/36.15/-5.35/60"
          p "https://opendata.adsb.fi/api/v2/lat/36.15/lon/-5.35/dist/60"
          p "https://opensky-network.org/api/states/all?lamin=35.2&lomin=-6.6&lamax=37.1&lomax=-4.1"
          B=$(( $(date +%s) - 86400 )); E=$(date +%s)
          p "https://opensky-network.org/api/flights/arrival?airport=LXGB&begin=$B&end=$E"
          echo "=================== routeset"
          curl -sS -m 25 -A "$UA" -H "Origin: https://www.clearway-atc.co.uk" -D h.txt -H 'Content-Type: application/json' -d '{"planes":[{"callsign":"EZY8901","lat":36.15,"lng":-5.35},{"callsign":"BAW492","lat":36.15,"lng":-5.35}]}' https://api.adsb.lol/api/0/routeset -o b.txt; grep -iE '^(HTTP|access-control)' h.txt; head -c 1500 b.txt; echo
          for u in https://www.gibraltarairport.gi/ https://www.gibraltarairport.gi/flight-information https://www.gibraltarairport.gi/arrivals https://www.gibraltarairport.gi/departures; do
            echo "=================== $u"; curl -sSL -m 25 -A "Mozilla/5.0" -D h.txt -o b.txt "$u"; grep -iE '^(HTTP|content-type)' h.txt
            grep -oiE 'href="[^"]*(arriv|depart|flight)[^"]*"' b.txt | sort -u | head -20
            grep -oiE '(api|ajax|json)[^"'"'"' ]{0,120}' b.txt | sort -u | head -20
            grep -oE '\b(EZY|BAW|RAM|EXS|TOM)[0-9]{2,4}[A-Z]?\b' b.txt | sort -u | head
          done
      - name: Save results to the probe branch
        if: always()
        run: |
          mkdir o && cp probe.txt o/ && cd o && git init -q -b probe
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "probe results"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe
